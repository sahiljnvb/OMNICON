<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with subtle squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Inner ambient circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(99,102,241,0.15)" stroke-width="1.5" stroke-dasharray="8 8" />

  <!-- Circular conversion arrows -->
  <!-- Top-Right arrow curve -->
  <path d="M 160 210 C 160 150, 210 110, 280 110 C 340 110, 390 150, 400 200" 
        fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" />
  <polygon points="380,215 410,210 405,175" fill="#a855f7" />

  <!-- Bottom-Left arrow curve -->
  <path d="M 352 302 C 352 362, 302 402, 232 402 C 172 402, 122 362, 112 312" 
        fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" />
  <polygon points="132,297 102,302 107,337" fill="#10b981" />

  <!-- Center Badge / Chip -->
  <g filter="url(#glow)">
    <rect x="186" y="186" width="140" height="140" rx="36" fill="#1e1b4b" stroke="url(#primaryGrad)" stroke-width="4" />
  </g>

  <!-- Central symbols: Document / Exchange indicator -->
  <path d="M 226 220 L 270 220 C 274 220, 282 228, 282 232 L 282 292 C 282 296, 278 300, 274 300 L 226 300 C 222 300, 218 296, 218 292 L 218 228 C 218 224, 222 220, 226 220 Z" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round" />
  <line x1="234" y1="248" x2="266" y2="248" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="234" y1="264" x2="258" y2="264" stroke="#a855f7" stroke-width="6" stroke-linecap="round" />
  <line x1="234" y1="280" x2="250" y2="280" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
</svg>
